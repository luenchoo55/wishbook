<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="leather" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#7a4a26"/>
      <stop offset="1" stop-color="#2e1a0c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d38a"/>
      <stop offset="0.55" stop-color="#c39437"/>
      <stop offset="1" stop-color="#7d5716"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf0d4"/>
      <stop offset="1" stop-color="#dcc28a"/>
    </linearGradient>
    <radialGradient id="wax" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#c24646"/>
      <stop offset="1" stop-color="#6a1414"/>
    </radialGradient>
  </defs>

  <!-- 皮革底 + 燙金框 -->
  <rect x="1" y="1" width="62" height="62" rx="12" fill="url(#leather)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="9" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- 書：書頁厚度、封面、書脊 -->
  <path d="M19 15h27a3 3 0 0 1 3 3v31a3 3 0 0 1-3 3H19z" fill="#e8d3a0"/>
  <rect x="15" y="12" width="31" height="38" rx="3" fill="url(#page)" stroke="url(#gold)" stroke-width="2"/>
  <rect x="15" y="12" width="6" height="38" rx="2" fill="url(#gold)"/>

  <!-- 封面愛心（蠟封紅） -->
  <path d="M33.5 39.5c-6.5-4.3-9.5-7.6-9.5-11.2 0-2.6 2-4.5 4.5-4.5 2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 2.5 0 4.5 1.9 4.5 4.5 0 3.6-3 6.9-9.5 11.2z" fill="url(#wax)" stroke="#4a0f0f" stroke-width="0.8"/>

  <!-- 星光 -->
  <path d="M49 7.5l1.8 5.2 5.2 1.8-5.2 1.8L49 21.5l-1.8-5.2-5.2-1.8 5.2-1.8z" fill="url(#gold)" stroke="#2e1a0c" stroke-width="0.6"/>
</svg>
